name: Release & Docker

on:
  push:
    branches:
      - master

# Um release por vez, sem cancelar o que está em andamento (cancelar no meio
# pode deixar uma tag criada sem a imagem correspondente)
concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: read

env:
  HUSKY: 0
  IMAGE: ghcr.io/${{ github.repository }}

jobs:
  check:
    name: Check
    uses: ./.github/workflows/ci.yml

  release:
    name: Release and publish Docker image
    needs: check
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
      issues: write
      pull-requests: write
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Além da tag e do release no GitHub, atualiza a versão do package.json
      # no workspace (sem commit), que vai para dentro da imagem
      - name: Semantic Release
        run: npx semantic-release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Check if a new release was created
        id: release
        run: |
          TAG=$(git tag --points-at HEAD --list 'v*' | head -n 1)
          if [ -n "$TAG" ]; then
            echo "released=true" >> "$GITHUB_OUTPUT"
            echo "version=${TAG#v}" >> "$GITHUB_OUTPUT"
            echo "Nova versão: $TAG"
          else
            echo "released=false" >> "$GITHUB_OUTPUT"
            echo "Nenhuma versão nova nesta execução."
          fi

      - name: Docker metadata
        if: steps.release.outputs.released == 'true'
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=semver,pattern={{version}},value=${{ steps.release.outputs.version }}
            type=raw,value=latest

      - name: Set up Docker Buildx
        if: steps.release.outputs.released == 'true'
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        if: steps.release.outputs.released == 'true'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker image
        if: steps.release.outputs.released == 'true'
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
