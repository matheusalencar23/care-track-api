name: CI

on:
    pull_request:
        branches:
            - master

jobs:
    check:
        name: Check
        runs-on: ubuntu-latest

        steps:
            - name: Checkout
              uses: actions/checkout@v4

            - name: Setup Node.js
              uses: actions/setup-node@v4
              with:
                node-version: 22
                cache: npm

            - name: Install dependencies
              run: npm ci

            - name: Create test environment
              run: |
                echo "ENV=test" >> .env.test
                echo "JWT_SECRET=test-secret" >> .env.test
                echo "MONGO_DB_URL_CONNECTION=mongodb://localhost:27017/care-track-test" >> .env.test
                echo "EMAIL_HOST=http://localhost:3000/verify-email" >> .env.test
                echo "RESEND_API_KEY=test-resend-api-key" >> .env.test
                echo "RESEND_EMAIL_ORIGIN=test@example.com" >> .env.test

            - name: Check
              run: npm run check