# Ambiente de desenvolvimento local.
#
#   docker compose up -d                 # Postgres e armazenamento de arquivos (use com `npm run dev`)
#   docker compose --profile app up -d   # o mesmo + migrações + API a partir do Dockerfile
#
# Com `npm run dev`, aponte o .env para o Postgres do compose (ver README)
# e aplique as migrações com `npm run db:migrate`.

services:
  postgres:
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: care_track
      POSTGRES_USER: care_track
      POSTGRES_PASSWORD: care_track
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql
      - ./docker/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "care_track", "-d", "care_track"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  storage:
    image: chrislusf/seaweedfs:4.50
    restart: unless-stopped
    command: ["mini", "-dir=/data"]
    environment:
      AWS_ACCESS_KEY_ID: care_track
      AWS_SECRET_ACCESS_KEY: care_track_secret
      S3_BUCKET: care-track-files
    ports:
      - "8333:8333"
    volumes:
      - storage-data:/data
    healthcheck:
      test: ["CMD", "nc", "-z", "localhost", "8333"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  migrate:
    profiles: ["app"]
    build: .
    image: care-track-api:local
    command: ["node", "dist/db/migrate.js"]
    environment:
      DATABASE_MIGRATION_URL: postgres://care_track:care_track@postgres:5432/care_track
    depends_on:
      postgres:
        condition: service_healthy

  api:
    profiles: ["app"]
    build: .
    image: care-track-api:local
    env_file: .env
    environment:
      # Sobrescreve valores do .env para usar o Postgres deste compose e a porta
      # interna fixa (a mesma do HEALTHCHECK do Dockerfile)
      DATABASE_URL: postgres://care_track_app:care_track_app@postgres:5432/care_track
      S3_ENDPOINT: http://storage:8333
      S3_PUBLIC_ENDPOINT: http://localhost:8333
      S3_REGION: us-east-1
      S3_BUCKET: care-track-files
      S3_ACCESS_KEY_ID: care_track
      S3_SECRET_ACCESS_KEY: care_track_secret
      S3_FORCE_PATH_STYLE: "true"
      PORT: "3001"
      # A imagem roda com NODE_ENV=production: o pino-pretty (devDependency)
      # não está instalado, os rate limits ficam ativos e o cookie é `secure`
      # (os navegadores aceitam em http://localhost)
    ports:
      - "${PORT:-3001}:3001"
    depends_on:
      migrate:
        condition: service_completed_successfully
      storage:
        condition: service_healthy

volumes:
  postgres-data:
  storage-data:
